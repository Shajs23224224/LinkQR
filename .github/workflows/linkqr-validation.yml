name: LinkQR validation

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm test
      - run: npm run build
      - name: Build backend container
        run: docker build -t linkqr-backend:ci .
      - name: Smoke test backend container
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name linkqr-backend-ci -p 18080:8080 \
            -e GOOGLE_PLAY_PACKAGE_NAME=com.linkqr \
            -e GOOGLE_PLAY_PRO_PRODUCT_ID=linkqr_pro \
            -e GOOGLE_SERVICE_ACCOUNT_JSON_B64=e30= \
            -e LINKQR_AUTH_ENABLED=false \
            -e LINKQR_SAAS_ENABLED=false \
            -e DATABASE_PATH=/data/linkqr-ci.db \
            linkqr-backend:ci
          trap 'docker rm -f linkqr-backend-ci >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:18080/ready; then
              break
            fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:18080/ready
          test "$(docker exec linkqr-backend-ci id -u)" != "0"

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - run: gradle :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease :app:bundleRelease
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linkqr-android-build-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
