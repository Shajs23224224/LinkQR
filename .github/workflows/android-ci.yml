name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & unit tests
    runs-on: ubuntu-latest
    env:
      LINKQR_ADMOB_APP_ID: ${{ secrets.LINKQR_ADMOB_APP_ID }}
      LINKQR_ADMOB_BANNER_AD_UNIT_ID: ${{ secrets.LINKQR_ADMOB_BANNER_AD_UNIT_ID }}
      LINKQR_ADMOB_INTERSTITIAL_AD_UNIT_ID: ${{ secrets.LINKQR_ADMOB_INTERSTITIAL_AD_UNIT_ID }}
      LINKQR_ADMOB_REWARDED_AD_UNIT_ID: ${{ secrets.LINKQR_ADMOB_REWARDED_AD_UNIT_ID }}
      LINKQR_KEYSTORE_PASSWORD: ${{ secrets.LINKQR_KEYSTORE_PASSWORD }}
      LINKQR_KEY_ALIAS: ${{ secrets.LINKQR_KEY_ALIAS }}
      LINKQR_KEY_PASSWORD: ${{ secrets.LINKQR_KEY_PASSWORD }}
      LINKQR_KEYSTORE_FILE: ${{ runner.temp }}/linkqr-upload.jks

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Detect signed release mode
        shell: bash
        run: |
          if git log -1 --pretty=%B | grep -Fq '[signed-release]'; then
            echo "LINKQR_SIGNED_RELEASE=true" >> "$GITHUB_ENV"
          else
            echo "LINKQR_SIGNED_RELEASE=false" >> "$GITHUB_ENV"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.6.0'

      - name: Bootstrap Gradle Wrapper
        run: gradle wrapper --gradle-version 9.6.0

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Restore release keystore
        shell: bash
        run: |
          if [ "$LINKQR_SIGNED_RELEASE" != "true" ]; then
            exit 0
          fi
          set -euo pipefail
          test -n "${LINKQR_KEYSTORE_B64:-}"
          printf '%s' "$LINKQR_KEYSTORE_B64" | base64 --decode > "$LINKQR_KEYSTORE_FILE"
          test -s "$LINKQR_KEYSTORE_FILE"
        env:
          LINKQR_KEYSTORE_B64: ${{ secrets.LINKQR_KEYSTORE_B64 }}

      - name: Validate signing credentials
        shell: bash
        run: |
          if [ "$LINKQR_SIGNED_RELEASE" != "true" ]; then
            exit 0
          fi
          set -euo pipefail
          test -n "$LINKQR_KEYSTORE_PASSWORD"
          test -n "$LINKQR_KEY_ALIAS"
          test -n "$LINKQR_KEY_PASSWORD"
          keytool -list \
            -keystore "$LINKQR_KEYSTORE_FILE" \
            -storepass "$LINKQR_KEYSTORE_PASSWORD" \
            -alias "$LINKQR_KEY_ALIAS" \
            >/dev/null

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Run unit tests
        run: ./gradlew test --stacktrace

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Build release AAB when signed
        shell: bash
        run: |
          if [ "$LINKQR_SIGNED_RELEASE" = "true" ]; then
            ./gradlew bundleRelease --stacktrace
          fi

      - name: Verify signed release
        shell: bash
        run: |
          if [ "$LINKQR_SIGNED_RELEASE" != "true" ]; then
            exit 0
          fi
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          AAB="app/build/outputs/bundle/release/app-release.aab"
          test -f "$APK"
          test -f "$AAB"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LinkQR-test-reports
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LinkQR-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK/AAB
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LinkQR-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Cleanup release keystore
        if: always()
        shell: bash
        run: rm -f "$LINKQR_KEYSTORE_FILE"
