name: Android Signed Release

"on":
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: android-signed-release
  cancel-in-progress: false

jobs:
  release:
    name: Signed APK + AAB
    runs-on: ubuntu-latest
    env:
      LINKQR_ADMOB_APP_ID: ${{ secrets.LINKQR_ADMOB_APP_ID }}
      LINKQR_ADMOB_BANNER_AD_UNIT_ID: ${{ secrets.LINKQR_ADMOB_BANNER_AD_UNIT_ID }}
      LINKQR_ADMOB_INTERSTITIAL_AD_UNIT_ID: ${{ secrets.LINKQR_ADMOB_INTERSTITIAL_AD_UNIT_ID }}
      LINKQR_ADMOB_REWARDED_AD_UNIT_ID: ${{ secrets.LINKQR_ADMOB_REWARDED_AD_UNIT_ID }}
      LINKQR_KEYSTORE_PASSWORD: ${{ secrets.LINKQR_KEYSTORE_PASSWORD }}
      LINKQR_KEY_ALIAS: ${{ secrets.LINKQR_KEY_ALIAS }}
      LINKQR_KEY_PASSWORD: ${{ secrets.LINKQR_KEY_PASSWORD }}
      LINKQR_KEYSTORE_FILE: ${{ runner.temp }}/linkqr-upload.jks

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.6.0'

      - name: Bootstrap Gradle Wrapper
        run: gradle wrapper --gradle-version 9.6.0

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Restore release keystore
        env:
          LINKQR_KEYSTORE_B64: ${{ secrets.LINKQR_KEYSTORE_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$LINKQR_KEYSTORE_B64"
          printf '%s' "$LINKQR_KEYSTORE_B64" | base64 --decode > "$LINKQR_KEYSTORE_FILE"
          test -s "$LINKQR_KEYSTORE_FILE"

      - name: Validate signing credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$LINKQR_KEYSTORE_PASSWORD"
          test -n "$LINKQR_KEY_ALIAS"
          test -n "$LINKQR_KEY_PASSWORD"
          keytool -list             -keystore "$LINKQR_KEYSTORE_FILE"             -storepass "$LINKQR_KEYSTORE_PASSWORD"             -alias "$LINKQR_KEY_ALIAS"             >/dev/null

      - name: Validate AdMob production configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$LINKQR_ADMOB_APP_ID"
          test -n "$LINKQR_ADMOB_BANNER_AD_UNIT_ID"
          test -n "$LINKQR_ADMOB_INTERSTITIAL_AD_UNIT_ID"
          test -n "$LINKQR_ADMOB_REWARDED_AD_UNIT_ID"

      - name: Run unit tests
        run: ./gradlew test --stacktrace

      - name: Build signed APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Build signed AAB
        run: ./gradlew bundleRelease --stacktrace

      - name: Verify release signatures
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          AAB="app/build/outputs/bundle/release/app-release.aab"
          test -f "$APK"
          test -f "$AAB"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: LinkQR-release-signed
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: LinkQR-release-aab-signed
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Cleanup keystore
        if: always()
        shell: bash
        run: rm -f "$LINKQR_KEYSTORE_FILE"
